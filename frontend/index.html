<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impact Agent</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='32' rx='27' ry='12' fill='none' stroke='%230B7A87' stroke-width='5' transform='rotate(35 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='27' ry='12' fill='none' stroke='%230B7A87' stroke-width='5' transform='rotate(-35 32 32)'/%3E%3C/svg%3E" />
    <script>
      // 첫 페인트 전에 테마 적용 (저장값 → OS 설정)
      (function () {
        try {
          var t = localStorage.getItem('impact-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

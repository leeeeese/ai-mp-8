[project]
name = "impact-agent"
version = "0.1.0"
description = "요건/운영 문의에 대한 영향도 분석 멀티 에이전트"
readme = "README.md"
requires-python = ">=3.11"
# 핵심 (스키마 · 흐름 제어 · 템플릿)
dependencies = [
    "pydantic>=2.7,<3",
    "jinja2>=3.1,<4",
    "python-dotenv>=1.0,<2",
]

# 기능별 묶음. 전부 설치: pip install -e ".[all,dev]"
[project.optional-dependencies]
llm = ["openai>=1.0,<3"]                   # Planner/Explorer/Retriever/Simulator/Verifier/Composer LLM 호출
graph = ["neo4j>=5.20,<7"]                 # 2-1 Explorer: Neo4j 의존 그래프
report = ["markdown>=3.6,<4", "weasyprint>=62"]  # 4 Composer: 레포트 PDF 저장
all = ["impact-agent[llm,graph,report]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
impact-agent = "impact_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impact_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

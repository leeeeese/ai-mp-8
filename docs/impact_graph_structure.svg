<!-- legend -->
<rect class="d0 main" x="60" y="664" width="22" height="12" rx="3"/><text class="s" x="88" y="674">진입 노드 (굵은 테두리) · 색 = 단계(공통 역할)</text>
<line class="x" x1="330" y1="670" x2="360" y2="670"/><text class="s" x="366" y="674">확장 관계 (tos Controller→SQL, swing Batch→TP·Module)</text>
<text class="s" x="60" y="694">같은 라벨은 영역마다 한 단계에만 둔다 (Batch = 0 진입, DBIO = 3 데이터 접근). 화면 범례·Planner target_role 과 같은 기준.</text>
<text class="s" x="60" y="710">tos / swing 영역은 업무 시스템 구분을 위해 나눠 그린 것으로, 실제로는 같은 라벨 체계의 하나의 그래프로 저장한다.</text>

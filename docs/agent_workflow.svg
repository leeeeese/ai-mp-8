<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1720" viewBox="0 0 760 860" font-family="Noto Sans CJK KR, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#e0603a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.l{stroke:#8a8a8a;stroke-width:1.2;fill:none}
.rl{stroke:#e0603a;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.gl{stroke:#9a9a9a;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.t{font-size:14px;font-weight:700}
.s{font-size:11px}
.e{font-size:10.5px;fill:#666}
.ag{fill:#efeefd;stroke:#7b74d6;stroke-width:0.8}
.agT{fill:#3b3591}
.or{fill:#e3f4ee;stroke:#3f9d86;stroke-width:0.8}
.orT{fill:#1f6b58}
.kp{fill:#fbeedd;stroke:#c98a3a;stroke-width:0.8}
.kpT{fill:#7a4a12}
.io{fill:#ffffff;stroke:#d4d4d4;stroke-width:0.8}
.ioT{fill:#222}
.grp{fill:none;stroke:#cfcfcf;stroke-width:0.8;stroke-dasharray:5 5}
</style>
</defs>
<rect width="760" height="860" fill="#fcfcfb"/>

<!-- input -->
<rect class="io" x="150" y="20" width="260" height="40" rx="8"/><text class="t ioT" x="280" y="45" text-anchor="middle">요건서 + SM 파트 선택</text>
<line class="l" x1="280" y1="60" x2="280" y2="88" marker-end="url(#a)"/>

<!-- supervisor -->
<rect class="or" x="130" y="90" width="300" height="50" rx="8"/><text class="t orT" x="280" y="111" text-anchor="middle">Supervisor</text><text class="s orT" x="280" y="129" text-anchor="middle">순서·재계획 제어 · 실행 로그 기록</text>
<line class="l" x1="280" y1="140" x2="280" y2="168" marker-end="url(#a)"/>

<!-- planner -->
<rect class="ag" x="130" y="170" width="300" height="52" rx="8"/><text class="t agT" x="280" y="191" text-anchor="middle">1. Planner</text><text class="s agT" x="280" y="210" text-anchor="middle">복잡도 · 목표 역할 · 방향 · hop 상한</text>
<path class="l" d="M280 222 L280 240 L152 240 L152 286" marker-end="url(#a)"/>
<text class="e" x="292" y="244">판정 결과로 이후 flow 결정</text>

<!-- analysis group -->
<rect class="grp" x="40" y="258" width="460" height="222" rx="12"/>
<text class="s" x="56" y="278" style="font-weight:700;fill:#333">분석</text>

<rect class="ag" x="60" y="288" width="185" height="58" rx="8"/><text class="t agT" x="152" y="311" text-anchor="middle">2-1 Explorer</text><text class="s agT" x="152" y="330" text-anchor="middle">시작 노드 매칭 · 목표 역할 탐색</text>
<rect class="ag" x="295" y="288" width="185" height="58" rx="8"/><text class="t agT" x="387" y="311" text-anchor="middle">2-2 Retriever</text><text class="s agT" x="387" y="330" text-anchor="middle">소스 직접 조회</text>
<line class="l" x1="245" y1="306" x2="293" y2="306" marker-end="url(#a)"/><text class="e" x="270" y="300" text-anchor="middle" style="font-size:9.5px">경로</text>
<line class="l" x1="295" y1="330" x2="247" y2="330" marker-end="url(#a)"/><text class="e" x="270" y="344" text-anchor="middle" style="font-size:9.5px">확장 요청</text>

<line class="l" x1="387" y1="346" x2="387" y2="398" marker-end="url(#a)"/><text class="e" x="394" y="376">복잡</text>
<rect class="ag" x="295" y="400" width="185" height="58" rx="8"/><text class="t agT" x="387" y="423" text-anchor="middle">2-3 Simulator</text><text class="s agT" x="387" y="442" text-anchor="middle">가능 여부 · 난이도 · 대안 비교</text>
<line class="l" x1="295" y1="429" x2="247" y2="429" marker-end="url(#a)"/>
<rect class="ag" x="60" y="400" width="185" height="58" rx="8"/><text class="t agT" x="152" y="423" text-anchor="middle">2-4 Verifier</text><text class="s agT" x="152" y="442" text-anchor="middle">영역 누락 · 근거 검증</text>

<!-- replan from verifier -->
<path class="rl" d="M60 429 L22 429 L22 115 L128 115" marker-end="url(#r)"/>
<text class="e" x="30" y="108" style="fill:#e0603a">재계획</text>

<!-- simple route -->
<path class="l" d="M480 317 L530 317 L530 556 L432 556" marker-end="url(#a)"/>
<text class="e" x="537" y="440">단순</text>

<!-- verifier to composer -->
<line class="l" x1="152" y1="458" x2="152" y2="528" marker-end="url(#a)"/>

<!-- composer -->
<rect class="ag" x="130" y="530" width="300" height="70" rx="8"/><text class="t agT" x="280" y="553" text-anchor="middle">3. Composer</text><text class="s agT" x="280" y="572" text-anchor="middle">레포트 · 체크리스트 생성</text><text class="s agT" x="280" y="588" text-anchor="middle">회신 메일 초안 · MD/PDF (요청 시)</text>

<!-- outputs -->
<line class="l" x1="220" y1="600" x2="152" y2="648" marker-end="url(#a)"/>
<line class="l" x1="340" y1="600" x2="390" y2="648" marker-end="url(#a)"/>
<rect class="io" x="40" y="650" width="225" height="88" rx="8"/><text class="t ioT" x="152" y="674" text-anchor="middle">복잡 요건 결과물</text>
<text class="s" x="152" y="694" text-anchor="middle" style="fill:#444">레포트: 영역별 영향·가능성·대안</text><text class="s" x="152" y="710" text-anchor="middle" style="fill:#444">체크리스트: 업무·개발 확인 항목</text><text class="s" x="152" y="726" text-anchor="middle" style="fill:#444">회신 메일 · PDF (요청 시)</text>
<rect class="io" x="280" y="650" width="220" height="88" rx="8"/><text class="t ioT" x="390" y="674" text-anchor="middle">단순 요건 응답</text>
<text class="s" x="390" y="700" text-anchor="middle" style="fill:#444">요약 결론</text><text class="s" x="390" y="718" text-anchor="middle" style="fill:#444">영향 경로 · 근거</text>

<!-- KPI -->
<path class="gl" d="M400 600 L400 620 L650 620 L650 648" marker-end="url(#a)"/>
<rect class="kp" x="560" y="650" width="180" height="58" rx="8"/><text class="t kpT" x="650" y="673" text-anchor="middle">KPI Agent</text><text class="s kpT" x="650" y="692" text-anchor="middle">재현율 · 미탐율 · 정밀도 · 시간</text>
<rect class="io" x="560" y="760" width="180" height="40" rx="8"/><text class="t ioT" x="650" y="785" text-anchor="middle">정답 경로 목록</text>
<line class="gl" x1="650" y1="760" x2="650" y2="710" marker-end="url(#a)"/>
<text class="e" x="658" y="740">+ 실행 로그</text>

<!-- legend -->
<rect class="ag" x="40" y="828" width="14" height="14" rx="3"/><text class="s" x="60" y="839" style="fill:#444">Agent</text>
<rect class="or" x="115" y="828" width="14" height="14" rx="3"/><text class="s" x="135" y="839" style="fill:#444">오케스트레이터</text>
<rect class="kp" x="225" y="828" width="14" height="14" rx="3"/><text class="s" x="245" y="839" style="fill:#444">신규 Agent</text>
<rect class="io" x="315" y="828" width="14" height="14" rx="3"/><text class="s" x="335" y="839" style="fill:#444">입력·결과물</text>
<line class="rl" x1="420" y1="835" x2="450" y2="835"/><text class="s" x="456" y="839" style="fill:#444">재계획</text>
<line class="gl" x1="550" y1="835" x2="580" y2="835"/><text class="s" x="586" y="839" style="fill:#444">평가(PoC)</text>
</svg>
